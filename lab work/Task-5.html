<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Centered Responsive NavBar</title>
  <style>
    body {
      margin: 0;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;   
      background-color: rgb(211, 91, 151);
      font-family: 'Gill Sans', 'Gill Sans MT', Calibri, 'Trebuchet MS', sans-serif;
    }

    .nav-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: linear-gradient(90deg, rgb(186, 83, 162), rgb(109, 46, 87));
      padding: 12px 25px;
      box-shadow: 0 4px 10px rgb(204, 128, 173);
      border-radius: 20px;
      width: 80%;
      max-width: 900px;
    }

    .img {
      display: flex;
      align-items: center;
      justify-content: center;
    }

    img {
      height: 60px;
      border-radius: 50%;
      border: 2px solid #b7a1a9;
      padding: 5px;
      background-color: rgb(186, 83, 162);
    }


    .nav-links {
      display: flex;
      gap: 25px;
    }

    .nav-links a {
      text-decoration: none;
      color: antiquewhite;
      font-weight: 600;
      background-color: rgb(109, 46, 87);
      padding: 8px 18px;
      border-radius: 20px;
      box-shadow: 0 2px 5px rgb(186, 83, 125);
      transition: all 0.3s ease;
    }

    .nav-links a:hover {
      background-color: #e89db9;
      color: #5b2e46;
      transform: scale(1.1);
      box-shadow: 0 4px 8px rgb(251, 211, 242);
    }

    @media (max-width: 768px) {
      .nav-bar {
        flex-direction: column;
        align-items: center;
        text-align: center;
        width: 90%;
        border-radius: 15px;
      }

      .nav-links {
        flex-direction: column;
        gap: 12px;
        margin-top: 15px;
      }

      .nav-links a {
        width: 80%;
        text-align: center;
      }

      .img {
        justify-content: center;
        margin-bottom: 10px;
      }
    }
  </style>
</head>
<body>
  <div class="nav-bar">
    <div class="img">
      <img src="./Image/5.jpg" alt="Logo">
    </div>

    <nav class="nav-links">
      <a href="#">Home</a>
      <a href="#">About</a>
      <a href="#">Services</a>
      <a href="#">Contact</a>
      <a href="#">Login</a>
    </nav>
  </div>
</body>
</html>
