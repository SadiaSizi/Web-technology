<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Shopping Card</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #e3e9e3;
    }

    table {
      background-color: rgb(235, 241, 241);
      border-radius: 10px;
      margin: 50px auto;
      width: 300px;
      box-shadow: 3px 3px 15px rgb(124, 109, 109);
      overflow: hidden; 
    }

    td {
      text-align: center;
      padding: 0;
    }

    img {
      width: 100%;
      height: 220px;
      object-fit: cover; 
      display: block;
      border: none;
    }

    h2 {
      color: #333;
      margin-top: 10px;
    }

    p {
      color: #555;
      margin: 8px 0;
    }

    del {
      color: red;
    }

    button {
      color: #f9feff;
      border: none;
      margin: 8px;
      padding: 15px 20px;
      cursor: pointer;
      font-size: 14px;
      border-radius: 5px;
    }

    .buy-btn {
      background-color: rgb(37, 156, 69);
    }
    .buy-btn:hover {
      background-color: rgb(130, 167, 139);
    }
    .cart-btn {
      background-color: rgb(187, 128, 52);
    }
    .cart-btn:hover {
      background-color: rgb(214, 165, 130);
    }

    a {
      color: rgb(47, 90, 175);
      font-size: small;
    }
    a:hover {
      text-decoration: underline;
      background-color: #b3c2c5;
    }
  </style>
</head>
<body>

  <table>
    <tr>
      <td>
        <img src="./2.jpg" alt="Premium Hijab">

        <h2>Premium Hijab</h2>
        <p>Soft and Georgette. Premium quality.</p>

        <p>⭐ ⭐ ⭐ ⭐ ⭐</p>

        <p>
          <del>$85</del><br>
          <b><span style="color:green;">$70</span></b> <sub><strong>-20%</strong></sub>
        </p>

        <div>
          <button class="buy-btn">Buy Now</button>
          <button class="cart-btn">Add to Cart</button>
        </div>
      </td>
    </tr>
  </table>

</body>
</html>
