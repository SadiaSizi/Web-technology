<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Responsive Interface</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background-color: #f4f4f9;
    }

    .navbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background-color: #2c3e50;
      padding: 15px 30px;
      color: white;
    }

    .navbar h1 {
      font-size: 22px;
    }

    .nav-links {
      display: flex;
      gap: 20px;
    }

    .nav-links a {
      text-decoration: none;
      color: white;
      background-color: #34495e;
      padding: 8px 15px;
      border-radius: 8px;
      transition: background-color 0.3s ease;
    }

    .nav-links a:hover {
      background-color: #63a07c;
    }

    .main {
      text-align: center;
      padding: 50px 20px;
    }

    .main h2 {
      color: #2c3e50;
    }

    .main p {
      color: #555;
      max-width: 600px;
      margin: auto;
      line-height: 1.6;
    }
    @media (max-width: 768px) {
      .navbar {
        flex-direction: column;
        text-align: center;
      }

      .nav-links {
        flex-direction: column;
        gap: 10px;
        margin-top: 10px;
      }
    }
  </style>
</head>
<body>

  <div class="navbar">
    <h1>Sizi's Home</h1>
    <div class="nav-links">
      <a href="#">Home</a>
      <a href="#">About</a>
      <a href="#">Email</a>
      <a href="#">Contact</a>
    </div>
  </div>

  <div class="main">
    <h2>Welcome to My Blog Page</h2>
    <p>
     Hi! It's me, Sizi. Glad to see you here. let's find out about me and my blog. Good luck man.
    </p>
  </div>
</body>
</html>
